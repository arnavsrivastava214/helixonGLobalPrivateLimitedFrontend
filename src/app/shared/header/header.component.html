<header class="header" [class.scrolled]="scrolled">
  <div class="header-background"></div>

  <div class="header-content">
    <div class="logo">
      <img
        src="https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=262,fit=crop,q=95/mv0DXgB5KwFZZN5w/helixson-removebg-preview-1-dWxyVDKB4gtp83RN.png"
        alt=""
      />
      <span class="logo-text"
        >Digital<span class="gradient-text">Hub</span></span
      >
    </div>

    <nav class="desktop-nav">
      <div class="nav-items">
        <div
          *ngFor="let item of menuItems"
          class="nav-item"
          (mouseenter)="toggleDropdown(item.id)"
          (mouseleave)="closeDropdown()"
        >
          <button class="nav-link">
            {{ item.label }}
            <svg
              class="chevron"
              [class.rotate]="activeDropdown === item.id"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
            >
              <path
                d="M4 6L8 10L12 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <div
            class="mega-dropdown"
            [class.active]="activeDropdown === item.id"
          >
            <div class="dropdown-content">
              <div class="dropdown-columns">
                <div
                  *ngFor="let column of item.columns"
                  class="dropdown-column"
                >
                  <h3 class="column-title">{{ column.title }}</h3>
                  <ul class="column-links">
                    <li *ngFor="let link of column.links">
                      <a [href]="link.url" class="dropdown-link">
                        <span class="link-icon">→</span>
                        {{ link.name }}
                      </a>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>

        <a href="/pricing" class="nav-link simple">Pricing</a>
        <a href="/contact" class="nav-link simple">Contact</a>
      </div>

      <div class="header-actions">
      </div>
    </nav>

    <button
      class="mobile-menu-btn"
      (click)="toggleMobileMenu()"
      [class.active]="mobileMenuOpen"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>

  <div class="mobile-menu" [class.open]="mobileMenuOpen">
    <div class="mobile-menu-content">
      <div class="mobile-menu-header">
        <div class="logo">
          <svg viewBox="0 0 40 40" class="logo-icon">
            <defs>
              <linearGradient
                id="logoGradientMobile"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop offset="0%" style="stop-color: #a855f7" />
                <stop offset="100%" style="stop-color: #ec4899" />
              </linearGradient>
            </defs>
            <circle
              cx="20"
              cy="20"
              r="18"
              fill="none"
              stroke="url(#logoGradientMobile)"
              stroke-width="2"
            />
            <path
              d="M12 20 L18 26 L28 14"
              fill="none"
              stroke="url(#logoGradientMobile)"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="logo-text"
            >Digital<span class="gradient-text">Hub</span></span
          >
        </div>
        <button class="close-btn" (click)="closeMobileMenu()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path
              d="M18 6L6 18M6 6L18 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <div class="mobile-nav">
        <div *ngFor="let item of menuItems" class="mobile-nav-section">
          <button class="mobile-nav-title" (click)="toggleDropdown(item.id)">
            {{ item.label }}
            <svg
              class="chevron"
              [class.rotate]="activeDropdown === item.id"
              width="20"
              height="20"
              viewBox="0 0 16 16"
              fill="none"
            >
              <path
                d="M4 6L8 10L12 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <div
            class="mobile-dropdown"
            [class.open]="activeDropdown === item.id"
          >
            <div *ngFor="let column of item.columns" class="mobile-column">
              <h4 class="mobile-column-title">{{ column.title }}</h4>
              <ul class="mobile-links">
                <li *ngFor="let link of column.links">
                  <a [href]="link.url" (click)="closeMobileMenu()">{{
                    link.name
                  }}</a>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <div class="mobile-simple-links">
          <a
            href="/pricing"
            class="mobile-simple-link"
            (click)="closeMobileMenu()"
            >Pricing</a
          >
          <a
            href="/contact"
            class="mobile-simple-link"
            (click)="closeMobileMenu()"
            >Contact</a
          >
        </div>
      </div>

      <div class="mobile-actions">
        <button class="btn-secondary" (click)="closeMobileMenu()">
          Sign In
        </button>
        <button class="btn-primary" (click)="closeMobileMenu()">
          Get Started
        </button>
      </div>
    </div>
  </div>
</header>
