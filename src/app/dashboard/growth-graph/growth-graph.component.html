<div class="carousel-wrapper">
  <div class="carousel-container" 
       (mouseenter)="onMouseEnter()" 
       (mouseleave)="onMouseLeave()"
       (touchstart)="onTouchStart($event)"
       (touchend)="onTouchEnd($event)">
    
    <!-- Background Gradient Orbs -->
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    
    <!-- Carousel Track -->
    <div class="carousel-track">
      <div *ngFor="let slide of slides; let i = index" 
           class="carousel-slide"
           [ngClass]="getSlideClass(i)"
           (click)="goToSlide(i)">
        
        <div class="slide-image-wrapper">
          <img [src]="slide.imageUrl" 
               [alt]="slide.title"
               class="slide-image">
          <div class="slide-overlay"></div>
        </div>
        
        <div class="slide-content">
          <div class="slide-number">{{ (i + 1).toString().padStart(2, '0') }}</div>
          <h3 class="slide-title">{{ slide.title }}</h3>
          <p class="slide-description">{{ slide.description }}</p>
          <div class="slide-cta">
            <span class="cta-text">Explore More</span>
            <svg class="cta-arrow" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation Controls -->
    <div class="carousel-controls">
      <button class="control-btn prev-btn" (click)="prevSlide()" aria-label="Previous slide">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      
      <button class="control-btn next-btn" (click)="nextSlide()" aria-label="Next slide">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Dot Indicators -->
    <div class="carousel-indicators">
      <button *ngFor="let slide of slides; let i = index"
              class="indicator-dot"
              [class.active]="i === currentIndex"
              (click)="goToSlide(i)"
              [attr.aria-label]="'Go to slide ' + (i + 1)">
      </button>
    </div>
  </div>
</div>
